name: Chatbot y PWA
on:
  push:
    branches:
      - main
      - mejora-chatbot-offline-20261022
  pull_request:
    paths:
      - 'asistente-embebido.js'
      - 'demo-chatbot.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/chatbot.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar lógica local y recursos sin conexión
        run: node --test tests/chatbot.test.mjs
